# XEDC 资源库
global-styles:
  version: VERSION
  css:
    base:
      css/base/tokens.css: { weight: -200 }
      css/base/reset.css: { weight: -190 }
      css/base/typography.css: { weight: -180 }
      css/base/utilities.css: { weight: -170 }
    component:
      css/components/sidebar.css: { weight: -105 }
      css/components/site-footer.css: { weight: -103 }
      css/components/theme-toggle.css: { weight: -100 }
      css/components/mobile-shell.css: { weight: -95 }
      css/components/paragraphs.css: { weight: -90 }
      css/components/gallery.css: { weight: -85 }
      css/components/search-suggest.css: { weight: -80 }
      css/components/hot-rank.css: { weight: -75 }
      components/button/button.css: { weight: -72 }
      components/avatar/avatar.css: { weight: -70 }
      components/dropdown/dropdown.css: { weight: -69 }

